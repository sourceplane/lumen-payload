apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: PC-7
  title: "PC4, part 2: media uploads in the CMS (media collection on R2)"
spec:
  goal: "Staff upload images and PDFs in /admin; each is stored in the environment's R2 bucket and served back from /api/media/file/<filename> on stage and prod."
  affects:
    - "apps/cms/**"
    - "tests/cms/**"
    - "packages/db/src/manifest.ts"
    - "packages/db/src/migrations/205_cms_media/**"
    - "tests/db/src/cms-migration.test.ts"
    - "pnpm-lock.yaml"
    - "tasks/PC-7.TaskContract.yaml"
  deps:
    - "PC-5"
  doneWhen:
    - "every lane of the PR is green: the CMS build, its suite, typecheck and a wrangler deploy --dry-run that binds R2_MEDIA"
    - "after the merge, on stage and prod: 205_cms_media applied, /health ok, and a staff upload is served back from /api/media/file/<filename> byte for byte"
  gates:
    - "migrations 200 and 205 produce exactly the schema Payload pushes (pg_dump -s -n cms identical), and 205 re-applies cleanly"
    - "the built Worker passes the local media run in workerd with a local R2 bucket: upload, byte-for-byte read back, bad uploads refused, admin-only delete"
    - "pnpm --filter @saas/cms-tests build passes"
  secrets:
    - "PAYLOAD_SECRET"
  envs:
    - "stage"
    - "prod"
