    - "the PR's plan-only lanes for cloudflare-hyperdrive-cms on stage and prod are green"
    - "the merge's apply lanes for cloudflare-hyperdrive-cms on stage and prod are green"
    - "cloudflare-hyperdrive is in neither plan"
  gates:
    - "terraform validate and fmt -check pass for the new root"
